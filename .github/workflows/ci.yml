name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  check:
    permissions:
      contents: read
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The build step used to be Windows-only (xcopy); ubuntu keeps it honest.
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Typecheck exported server template
        run: npm run typecheck:template

      - name: Build
        run: npm run build

      - name: Test
        run: npm test
